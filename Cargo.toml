[package]
name = "tf2monitor"
version = "0.1.16"
edition = "2024"
rust-version = "1.95"

[dependencies]
regex = "1.13.1"
bus = "2.4.1"
once_cell = "1.21.4"
chrono = "0.4.45"
date_component = "0.4.8"
fs-err = "3.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

log = { version = "0.4.35", features = [
    "max_level_info",
    "release_max_level_info",
] }

simple_logger = { version = "5.2.0", default-features = false, features = [
    "colors",
] }

eframe = { version = "0.37.0", default-features = false, features = [
    "wgpu",
    "clipboard",
    "links",
    "default_fonts",
    "persistence",
    "x11",           # Linux X11 support (required for Linux)
    "wayland",       # Linux Wayland support (modern Linux display server)
] }

egui_extras = { version = "0.37.0", features = ["all_loaders"] }

image = { version = "0.25.10", default-features = false, features = ["jpeg"] }

reqwest = { version = "0.13.5", features = ["blocking", "json"] }
translators = { version = "0.2.1", features = ["google"] }

scraper = "0.29.0"

diesel = { version = "2.4.0", features = [
    "sqlite",
    "chrono",
    "returning_clauses_for_sqlite_3_35",
    "r2d2",
] }
libsqlite3-sys = { version = "0.40.0", features = ["bundled"] }
sha2 = "0.11.1"
flate2 = "1.1.11"

#
# Platform specific crates
#
[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
