name: Rust (Windows)

on:
  workflow_dispatch: # Manual build
  push:
    tags: ['v*']
  release:
    types: [created] # Trigger on manually created release

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Build
        run: cargo build

      - name: Run tests
        run: cargo test

  release:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Read and validate release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          $metadata = cargo metadata --no-deps --locked --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'tf2monitor').version
          if (-not $version) {
            throw "Could not find the TF2Monitor package version"
          }
          if ($env:RELEASE_TAG -and $env:RELEASE_TAG -ne "v$version") {
            throw "Release tag $env:RELEASE_TAG does not match Cargo.toml version $version"
          }
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Build release
        run: cargo build --release --locked

      - name: Create release archive
        shell: pwsh
        run: |
          $archiveName = "tf2monitor-v$env:VERSION-windows-x64.zip"
          # Create zip with exe file and README.md
          Compress-Archive -Path "target\release\tf2monitor.exe", "README.md" -DestinationPath $archiveName
          echo "Created archive: $archiveName"
          echo "ARCHIVE_NAME=$archiveName" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows-release
          path: ${{ env.ARCHIVE_NAME }}
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: ${{ env.ARCHIVE_NAME }}
          generate_release_notes: ${{ github.event_name == 'push' }}
          fail_on_unmatched_files: true
